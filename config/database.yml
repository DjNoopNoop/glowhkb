default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: glowhkb_development

test:
  <<: *default
  database: glowhkb_test

production:
  <<: *default
  database: glowhkb_production
  url: <%= ENV["DATABASE_URL"] %>
  # In production we prefer a single DATABASE_URL connection string.
